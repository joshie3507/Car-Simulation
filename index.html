<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Simulator</title>
    <link rel="stylesheet" href="styles/style.css">
</head>
<body>
    <div class="container">
        <div class="banner">
            <h1>Car Simulator</h1>
        </div>
        <div class="content">
            <div class="text-container">
                <p>This is a car simulator where you can choose an engine from a preset list, a car body and some tyres to experiment on how fast it could be.</p>
                <p>Dont worry about if it is physically possible.  That doesn't matter here!</p>
                <p>Have fun and be creative!</p>
            </div>

            <div class="button-container">
                <div class="button-div">
                    <button><img src="images/cog.png" alt="Options"></button>
                </div>
                
                <div class="button-div">
                    <button><img src="images/rocket.png" alt="Go"></button>
                </div>
            </div>
        </div>
    </div>
</body>
<script>
    document.addEventListener("DOMContentLoaded", function() {
        const buttons = document.querySelectorAll(".button-div button");
        buttons.forEach(button => {
            button.addEventListener("click", function() {
                const img = this.querySelector("img");
                if (img.alt === "Options") {
                    window.location.href = "options.html";
                } else if (img.alt === "Go") {
                    window.location.href = "go.html";
                }
            });
        });
    });
</script>
</html>
