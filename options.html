<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Options</title>
    <link rel="stylesheet" href="styles/style.css">
    <link rel="stylesheet" href="styles/form-style.css">
</head>
<body>
    <div class="container">
        <div class="banner">
            <h1>Car Simulator</h1>
        </div>
        <div class="content">
            <h2>Options</h2>
            <p>Welcome to the Car Simulator!</p>
            <p>Here you can customize your car and see how it performs.</p>
            
            <form>
                <div class="form-section">
                    <label class="form-label" for="engine">Engine:</label>
                    <select class="selector" name="engine" id="engine">
                        <option value="v6">V6</option>
                        <option value="v8">V8</option>
                        <option value="v10">V10</option>
                    </select>
                </div>
                <div class="form-section">
                    <label class="form-label" for="body">Body:</label>
                    <select class="selector" name="body" id="body">
                        <option value="sedan">Sedan</option>
                        <option value="suv">SUV</option>
                        <option value="truck">Truck</option>
                    </select>
                </div>
                <div class="form-section">
                    <label class="form-label" for="tyres">Tyres:</label>
                    <select class="selector" name="tyres" id="tyres">
                        <option value="standard">Standard</option>
                        <option value="performance">Performance</option>
                        <option value="offroad">Off-Road</option>
                    </select>
                </div>
                <input type="submit" value="Save" class="submit-button">
            </form>
        </div>
    </div>
</body>
<script>

</script>
</html>
