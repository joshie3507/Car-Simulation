<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Options</title>
    <link rel="stylesheet" href="styles/style.css">
    <link rel="stylesheet" href="styles/form-style.css">
</head>
<body>
    <div class="container">
        <div class="banner">
            <h1>Car Simulator</h1>
        </div>
        <div class="content">
            <h2>Options</h2>
            <p>Welcome to the Car Simulator!</p>
            <p>Here you can customize your car and see how it performs.</p>
            
            <form>
                <div class="form-section">
                    <label class="form-label" for="engine">Engine:</label>
                    <select class="selector" name="engine" id="engine">
                        <option value="">Select an engine</option>
                        <!-- Options will be populated dynamically using JavaScript -->
                    </select>
                </div>
                <div class="form-section">
                    <label class="form-label" for="body">Body:</label>
                    <select class="selector" name="body" id="body">
                        <option value="">Select a body</option>
                        <!-- Options will be populated dynamically using JavaScript -->
                    </select>
                </div>
                <div class="form-section">
                    <label class="form-label" for="tyres">Tyres:</label>
                    <select class="selector" name="tyres" id="tyres">
                        <option value="">Select tyres</option>
                        <!-- Options will be populated dynamically using JavaScript -->
                    </select>
                </div>
                <input type="submit" value="Save" class="submit-button">
            </form>
        </div>
    </div>
</body>
<script>
document.addEventListener("DOMContentLoaded", async () => {
  const form = document.querySelector("form");
  const engineSelect = document.getElementById("engine");
  const bodySelect = document.getElementById("body");
  const tyresSelect = document.getElementById("tyres");

  const populateOptions = (options) => {
    const engineOptions = options.engines;
    const bodyOptions = options.bodies;
    const tyreOptions = options.tyres;

    // Populate the engine options
    engineOptions.forEach((engine) => {
      const option = document.createElement("option");
      option.value = engine.id;
      option.textContent =
        engine.configuration + " - " + engine.horsepower + " HP - " + engine.torque + " Nm";
      engineSelect.appendChild(option);
    });

    // Populate the body options
    bodyOptions.forEach((body) => {
      const option = document.createElement("option");
      option.value = body.id;
      option.textContent = body.year + " " + body.make + " " + body.model;
      bodySelect.appendChild(option);
    });

    // Populate the tyres options
    tyreOptions.forEach((tyre) => {
      const option = document.createElement("option");
      option.value = tyre.id;
      option.textContent = tyre.type + " - " + tyre.brand + " " + tyre.model + " - " + tyre.size;
      tyresSelect.appendChild(option);
    });
  };

  try {
    const response = await fetch("options.json");
    if (!response.ok) {
      throw new Error("Failed to load options.json: " + response.status);
    }
    const options = await response.json();
    populateOptions(options);
  } catch (error) {
    console.error(error);
  }

    form.addEventListener("submit", (event) => {
        event.preventDefault();
    
        const selectedEngine = engineSelect.value;
        const selectedBody = bodySelect.value;
        const selectedTyres = tyresSelect.value;
    
        if (!selectedEngine || !selectedBody || !selectedTyres) {
        alert("Please select an option for each category.");
        return;
        }

    
        const choice = {
        engine: selectedEngine,
        body: selectedBody,
        tyres: selectedTyres,
        };
    
        localStorage.setItem("choice", JSON.stringify(choice));

        window.location.href = "index.html"; // Redirect to index.html after saving
    });
});
</script>
</html>
